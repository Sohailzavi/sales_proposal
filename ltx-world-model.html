<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LTX — The world model</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
      --glass-x: 24%;
      --glass-y: 8%;
      --cap-left: -5px;
      --cap-width: calc(20% + 5px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, a, input {
      font-family: inherit;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* ═══════════════════ STAGE & LAYERING ═══════════════════ */
    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* Media Layer (z: 0) */
    .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .media.active-layer {
      visibility: visible;
    }

    /* Hero Layer (z: 10) */
    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hero h1 {
      position: absolute;
      top: 35.9%;
      left: 50%;
      transform: translateX(-50%);
      width: min(901px, calc(100vw - 48px));
      font-size: clamp(62px, 6.8vw, 100px);
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: -0.04em;
      white-space: nowrap;
      text-align: center;
      text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
      display: flex;
      justify-content: center;
      gap: 0.26em;
    }

    .hero h1 span {
      display: inline-block;
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0);
      transition: opacity 900ms var(--retake-ease),
                  filter 900ms var(--retake-ease),
                  transform 900ms var(--retake-ease);
    }

    .hero h1 span:nth-child(1) { transition-delay: 0ms; }
    .hero h1 span:nth-child(2) { transition-delay: 90ms; }
    .hero h1 span:nth-child(3) { transition-delay: 180ms; }

    .stage.title-hidden .hero h1 span {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(-10px);
    }

    .hero p {
      position: absolute;
      top: calc(46.78% + 94px);
      left: 50%;
      transform: translateX(-50%);
      width: min(734px, calc(100vw - 48px));
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      text-align: center;
      text-shadow: 0 1px 8px rgb(0 0 0 / 0.16);
      color: rgba(255, 255, 255, 0.95);
    }

    /* ═══════════════════ HEADER (z: 30) ═══════════════════ */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
      text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
    }

    .logo-svg {
      height: 24px;
      width: auto;
      display: block;
    }

    .meta {
      display: flex;
      margin-left: clamp(48px, 5vw, 70px);
      gap: clamp(28px, 3vw, 44px);
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.92);
    }

    .try-now-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 152px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgb(255 255 255 / 0.75);
      background: transparent;
      color: #fff;
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.02em;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 300ms var(--retake-ease),
                  color 300ms var(--retake-ease),
                  border-color 300ms var(--retake-ease);
    }

    .try-now-btn:hover,
    .try-now-btn:focus-visible {
      background: #ffffff;
      color: #0b1a26;
      border-color: #ffffff;
    }

    /* ═══════════════════ CONTROLLER & GLASS (z: 20) ═══════════════════ */
    .controller {
      position: absolute;
      top: 46.78%;
      left: 50%;
      transform: translateX(-50%);
      width: min(880px, calc(100vw - 48px));
      height: 72px;
      z-index: 20;
    }

    .track {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      background: rgb(24 55 82 / 0.31);
      border: 1px solid rgb(255 255 255 / 0.2);
      -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      box-shadow:
        0 14px 38px rgb(4 24 43 / 0.16),
        0 2px 7px rgb(4 24 43 / 0.1),
        inset 1px 1px 0 rgb(255 255 255 / 0.48),
        inset -1px -1px 0 rgb(21 49 73 / 0.14),
        inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
      transition: left 980ms var(--retake-slow-ease),
                  width 980ms var(--retake-slow-ease),
                  opacity 400ms linear;
    }

    .capsule {
      position: absolute;
      top: -1px;
      left: var(--cap-left, -5px);
      width: var(--cap-width, calc(20% + 5px));
      height: 72px;
      border-radius: 999px;
      background: rgb(246 251 255 / 0.24);
      border: 1px solid rgb(255 255 255 / 0.28);
      -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      box-shadow:
        0 11px 28px rgb(4 24 43 / 0.17),
        0 2px 6px rgb(4 24 43 / 0.1),
        inset 1px 1px 0 rgb(255 255 255 / 0.62),
        inset -1px -1px 0 rgb(20 49 73 / 0.18),
        inset 0 0 12px rgb(255 255 255 / 0.055);
      pointer-events: none;
      transition: left 620ms var(--retake-ease),
                  width 620ms var(--retake-ease),
                  background 980ms var(--retake-slow-ease),
                  transform 980ms var(--retake-slow-ease);
    }

    /* Glass Pseudo-Elements */
    .glass::before,
    .glass::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .glass::before {
      background:
        radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%),
                        rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
        linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
    }

    .glass::after {
      padding: 1px;
      background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff,
                                 #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
    }

    .track::after {
      opacity: 0.27;
    }

    .capsule::after {
      opacity: 0.30;
    }

    /* Grid Cells */
    .cells {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 2;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 14px;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      white-space: nowrap;
      background: transparent;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      transition: opacity 420ms var(--retake-ease),
                  filter 420ms var(--retake-ease),
                  transform 980ms var(--retake-slow-ease),
                  color 300ms var(--retake-ease);
    }

    .cell.guide-label {
      cursor: default;
      color: rgba(255, 255, 255, 0.95);
      transition: opacity 300ms var(--retake-ease);
    }

    .controller.btn-hovered .guide-label {
      opacity: 0.5;
    }

    .cell:disabled {
      cursor: default;
    }

    /* Reset Button Presentation */
    .cell.reset-state {
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      animation: resetReveal 520ms var(--retake-ease) forwards;
    }

    @keyframes resetReveal {
      0% {
        opacity: 0;
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* Collapsed & Motion States */
    .controller.collapsed .track {
      left: calc(50% - 96px);
      width: 192px;
      opacity: 0;
      transition: left 980ms var(--retake-slow-ease),
                  width 980ms var(--retake-slow-ease),
                  opacity 400ms linear 650ms;
    }

    .controller.collapsed .capsule {
      left: calc(50% - 100px);
      width: 200px;
      background: rgb(246 251 255 / 0.14);
      transition: left 980ms var(--retake-slow-ease),
                  width 980ms var(--retake-slow-ease),
                  background 980ms var(--retake-slow-ease);
    }

    .controller.collapsed .cell:not(.chosen-cell) {
      opacity: 0;
      filter: blur(10px);
      transform: scale(0.94);
      pointer-events: none;
    }

    /* Live Region / Status Notice (z: 40) */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .notice {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 8px 16px;
      background: rgba(18, 24, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: -0.02em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms var(--retake-ease);
    }

    .notice.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .notice-retry-btn {
      background: transparent;
      border: none;
      color: #7fe3ff;
      font-weight: 600;
      margin-left: 8px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ═══════════════════ RESPONSIVE BREAKPOINTS ═══════════════════ */
    @media (max-width: 900px) {
      header {
        padding: calc(24px + env(safe-area-inset-top)) 24px 24px;
      }
      .meta {
        font-size: 14px;
        gap: 22px;
        margin-left: 34px;
      }
      .try-now-btn {
        width: 116px;
        height: 36px;
        font-size: 14px;
      }
      .cell {
        font-size: clamp(17px, 2.5vw, 24px);
      }
    }

    @media (max-width: 700px) {
      header {
        padding-left: 18px;
        padding-right: 18px;
      }
      .logo-svg {
        height: 21px;
      }
      .meta {
        font-size: 12px;
      }
      .meta-tag-speed {
        display: none;
      }
      .try-now-btn {
        width: 92px;
        height: 34px;
        font-size: 13px;
        position: relative;
      }
      .try-now-btn::after {
        content: '';
        position: absolute;
        inset: -6px -10px;
      }

      .hero h1 {
        top: 34%;
        width: calc(100vw - 40px);
        font-size: clamp(48px, 14vw, 64px);
        line-height: 0.88;
        white-space: normal;
        flex-wrap: wrap;
      }

      .hero p {
        top: 77%;
        width: calc(100vw - 44px);
        font-size: 14px;
      }

      .controller {
        top: 53%;
        width: calc(100vw - 40px);
        height: 156px;
      }

      .track {
        top: 0;
        height: 156px;
        border-radius: 28px;
      }

      .cells {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: 48px 54px 54px;
      }

      .cell.guide-label {
        grid-column: 1 / -1;
        border-bottom: 1px solid rgb(255 255 255 / 0.12);
      }

      .cell:nth-child(2), .cell:nth-child(4) {
        border-right: 1px solid rgb(255 255 255 / 0.12);
      }

      .cell:nth-child(2), .cell:nth-child(3) {
        border-bottom: 1px solid rgb(255 255 255 / 0.12);
      }

      .cell {
        font-size: 17px;
      }

      .cell:focus-visible {
        outline-offset: -3px;
      }

      /* Sliding hover capsule disabled on mobile matrix */
      .capsule {
        opacity: 0;
        pointer-events: none;
      }

      .controller.collapsed .capsule {
        opacity: 1;
        left: 50%;
        top: 4vh;
        top: 4dvh;
        transform: translate(-50%, -50%);
        width: 196px;
        height: 64px;
        border-radius: 999px;
        background: rgb(246 251 255 / 0.18);
      }

      .controller.collapsed .track {
        opacity: 0;
      }
    }

    @media (max-width: 700px) and (max-height: 700px) {
      .controller {
        top: 50%;
      }
      .hero p {
        top: calc(50% + 168px);
        width: calc(100vw - 32px);
        font-size: 13px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .hero h1 {
        top: 20%;
        font-size: clamp(34px, 8vh, 56px);
      }
      .controller {
        top: 50%;
      }
      .hero p {
        top: auto;
        bottom: 8px;
        font-size: 13px;
      }
    }

    @media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
      .hero h1 {
        top: 12%;
        font-size: clamp(28px, 7vh, 44px);
      }
      .controller {
        top: 46%;
        height: 118px;
      }
      .track {
        height: 118px;
      }
      .cells {
        grid-template-rows: 36px 41px 41px;
      }
      .cell {
        font-size: 15px;
      }
      .hero p {
        bottom: 6px;
        font-size: 12px;
      }
    }

    /* Accessibility - Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
        animation-duration: 1ms !important;
      }
      .hero h1 span,
      .controller.collapsed .cell:not(.chosen-cell),
      .cell.reset-state {
        filter: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">

    <!-- ═══════════════════ 8 PERSISTENT VIDEO ELEMENTS ═══════════════════ -->
    <!-- Clothing (video-1) -->
    <video class="media active-layer" id="v-clothing-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="v-clothing-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- Scene (video-2) -->
    <video class="media" id="v-scene-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="v-scene-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- Lighting (video-3) -->
    <video class="media" id="v-lighting-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="v-lighting-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- Cast (video-4) -->
    <video class="media" id="v-cast-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="v-cast-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- ═══════════════════ HERO COPY ═══════════════════ -->
    <div class="hero">
      <h1>
        <span>The</span>
        <span>world</span>
        <span>model</span>
      </h1>
      <p>LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.</p>
    </div>

    <!-- ═══════════════════ CONTROLLER ═══════════════════ -->
    <div class="controller" id="controller" role="group" aria-label="Scene state controller">
      <div class="track glass"></div>
      <div class="capsule glass" id="capsule"></div>

      <div class="cells" id="cellsGroup">
        <div class="cell guide-label" id="guideLabel" aria-hidden="true">Select state →</div>
        <button type="button" class="cell" id="btn-scene" data-control="scene" data-index="1" aria-label="Select Scene">Scene</button>
        <button type="button" class="cell" id="btn-lighting" data-control="lighting" data-index="2" aria-label="Select Lighting">Lighting</button>
        <button type="button" class="cell" id="btn-clothing" data-control="clothing" data-index="3" aria-label="Select Clothing">Clothing</button>
        <button type="button" class="cell" id="btn-cast" data-control="cast" data-index="4" aria-label="Select Cast">Cast</button>
      </div>
    </div>

    <!-- ═══════════════════ HEADER ═══════════════════ -->
    <header>
      <div class="header-left">
        <a href="https://ltx.io/" class="logo-link" aria-label="LTX home">
          <svg class="logo-svg" viewBox="0 0 75 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M0 0H7.5V24.5H23V32H0V0Z" fill="#FFFFFF"/>
            <path d="M26 0H50V7.5H41.75V32H34.25V7.5H26V0Z" fill="#FFFFFF"/>
            <path d="M51.5 0H59.3L65 10.8L70.7 0H78.5L68.9 16L78.5 32H70.7L65 21.2L59.3 32H51.5L61.1 16L51.5 0Z" fill="#FFFFFF"/>
          </svg>
        </a>
        <div class="meta">
          <span>LTX-2.5 is here</span>
          <span class="meta-tag-speed">Smarter. Faster</span>
        </div>
      </div>
      <a href="https://app.ltx.io/" class="try-now-btn" target="_blank" rel="noopener noreferrer">Try now</a>
    </header>

    <!-- ═══════════════════ ARIA LIVE STATUS & ERROR NOTICE ═══════════════════ -->
    <div class="sr-only" role="status" aria-live="polite" id="liveStatus">Base scene ready</div>
    <div class="notice" id="errorNotice" role="alert">
      <span id="noticeMsg">Playback interrupted</span>
      <button type="button" class="notice-retry-btn" id="retryBtn">Retry</button>
    </div>

  </div>

  <!-- ═══════════════════ SCRIPT ENGINE ═══════════════════ -->
  <script>
    (function () {
      'use strict';

      // 1. Media Configuration
      var MEDIA_MAP = {
        clothing: {
          fwd: document.getElementById('v-clothing-fwd'),
          rev: document.getElementById('v-clothing-rev'),
          fwdHold: 0.08,
          revHold: 0.08
        },
        scene: {
          fwd: document.getElementById('v-scene-fwd'),
          rev: document.getElementById('v-scene-rev'),
          fwdHold: 0.08,
          revHold: 0.18
        },
        lighting: {
          fwd: document.getElementById('v-lighting-fwd'),
          rev: document.getElementById('v-lighting-rev'),
          fwdHold: 0.08,
          revHold: 0.08
        },
        cast: {
          fwd: document.getElementById('v-cast-fwd'),
          rev: document.getElementById('v-cast-rev'),
          fwdHold: 0.08,
          revHold: 0.08
        }
      };

      // 2. DOM References
      var stage = document.getElementById('stage');
      var controller = document.getElementById('controller');
      var capsule = document.getElementById('capsule');
      var cellsGroup = document.getElementById('cellsGroup');
      var guideLabel = document.getElementById('guideLabel');
      var liveStatus = document.getElementById('liveStatus');
      var errorNotice = document.getElementById('errorNotice');
      var retryBtn = document.getElementById('retryBtn');

      var controlButtons = [
        document.getElementById('btn-scene'),
        document.getElementById('btn-lighting'),
        document.getElementById('btn-clothing'),
        document.getElementById('btn-cast')
      ];

      // Capsule layout positions (0 = Select state, 1 = Scene, 2 = Lighting, 3 = Clothing, 4 = Cast)
      var CAPSULE_POSITIONS = [
        { left: '-5px', width: 'calc(20% + 5px)' },
        { left: '20%', width: '20%' },
        { left: '40%', width: '20%' },
        { left: '60%', width: '20%' },
        { left: '80%', width: 'calc(20% + 5px)' }
      ];

      // 3. State Machine Variables
      var currentBranch = null;        // null ('base') | 'scene' | 'lighting' | 'clothing' | 'cast'
      var activeVideo = MEDIA_MAP.clothing.fwd; // Base is video-1 at frame 0
      var isLocked = false;
      var transitionToken = 0;
      var activeRafId = null;
      var activeHoldHandler = null;
      var lastFailedAction = null;

      // 4. Set Capsule Position
      function setCapsulePos(index) {
        var pos = CAPSULE_POSITIONS[index] || CAPSULE_POSITIONS[0];
        controller.style.setProperty('--cap-left', pos.left);
        controller.style.setProperty('--cap-width', pos.width);
      }

      // Initial Base Setup
      setCapsulePos(0);
      activeVideo.currentTime = 0;
      activeVideo.pause();

      // Announce ready state
      function announce(msg) {
        if (liveStatus) {
          liveStatus.textContent = msg;
        }
      }

      function showError(msg, retryAction) {
        lastFailedAction = retryAction;
        document.getElementById('noticeMsg').textContent = msg || 'Playback failed';
        errorNotice.classList.add('visible');
        isLocked = false;
        enableAvailableButtons();
      }

      function hideError() {
        errorNotice.classList.remove('visible');
        lastFailedAction = null;
      }

      if (retryBtn) {
        retryBtn.addEventListener('click', function () {
          hideError();
          if (typeof lastFailedAction === 'function') {
            lastFailedAction();
          }
        });
      }

      // 5. Mouse Pointer Glass Tracking
      controller.addEventListener('pointermove', function (e) {
        var rect = controller.getBoundingClientRect();
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        controller.style.setProperty('--glass-x', x.toFixed(1) + '%');
        controller.style.setProperty('--glass-y', y.toFixed(1) + '%');
      });

      // 6. Hover & Focus Management for Buttons
      controlButtons.forEach(function (btn) {
        var idx = parseInt(btn.getAttribute('data-index'), 10);

        function handleEnter() {
          if (!isLocked && currentBranch === null) {
            setCapsulePos(idx);
            controller.classList.add('btn-hovered');
          }
        }

        function handleLeave() {
          if (!isLocked && currentBranch === null) {
            var activeEl = document.activeElement;
            var isFocusHeld = controlButtons.some(function (b) { return b === activeEl; });
            if (!isFocusHeld) {
              setCapsulePos(0);
              controller.classList.remove('btn-hovered');
            }
          }
        }

        btn.addEventListener('mouseenter', handleEnter);
        btn.addEventListener('mouseleave', handleLeave);
        btn.addEventListener('focus', handleEnter);
        btn.addEventListener('blur', handleLeave);
      });

      // 7. Button Locking & Accessibility Utilities
      function disableAllButtons() {
        controlButtons.forEach(function (btn) {
          btn.disabled = true;
          btn.tabIndex = -1;
        });
      }

      function enableAvailableButtons() {
        if (currentBranch === null) {
          controlButtons.forEach(function (btn) {
            btn.disabled = false;
            btn.tabIndex = 0;
            btn.removeAttribute('aria-hidden');
          });
        }
      }

      // 8. Seam-Safe Frame Decoder Promise
      function waitForDecodedFrame(video) {
        return new Promise(function (resolve, reject) {
          var resolved = false;

          function done() {
            if (!resolved) {
              resolved = true;
              resolve();
            }
          }

          if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
            var handleId = video.requestVideoFrameCallback(function (now, metadata) {
              if (metadata.mediaTime <= 0.5 && video.readyState >= 2) {
                done();
              } else {
                // Keep waiting if stale
                video.requestVideoFrameCallback(function () {
                  done();
                });
              }
            });
          } else {
            // Fallback double rAF tick
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                done();
              });
            });
          }
        });
      }

      // 9. Execute Video Transition
      function runTransition(targetVideo, holdOffset, isForward, branchKey, onComplete) {
        var token = ++transitionToken;
        isLocked = true;
        disableAllButtons();
        hideError();

        // Pause current video
        if (activeVideo && activeVideo !== targetVideo) {
          activeVideo.pause();
        }

        // Rewind target video
        targetVideo.currentTime = 0;

        function startPlayback() {
          if (token !== transitionToken) return;

          var framePromise = waitForDecodedFrame(targetVideo);
          var playPromise = targetVideo.play();

          Promise.all([playPromise, framePromise]).then(function () {
            if (token !== transitionToken) return;

            // Atomic visibility switch
            if (activeVideo && activeVideo !== targetVideo) {
              activeVideo.classList.remove('active-layer');
            }
            targetVideo.classList.add('active-layer');
            activeVideo = targetVideo;

            // Monitor progress for hold point and title fade
            var duration = targetVideo.duration || (isForward ? 2.08 : 2.08);
            var holdTime = Math.max(0, duration - holdOffset);
            var titleHidePoint = Math.min(duration * 0.12, 0.9);
            var titleFaded = false;

            function checkFrame() {
              if (token !== transitionToken) return;

              var curTime = targetVideo.currentTime;

              // Hide title on forward progress
              if (isForward && !titleFaded && curTime >= titleHidePoint) {
                stage.classList.add('title-hidden');
                titleFaded = true;
              }

              // Check hold point
              if (curTime >= holdTime || targetVideo.ended) {
                targetVideo.pause();
                targetVideo.currentTime = holdTime;
                if (typeof onComplete === 'function') {
                  onComplete(token);
                }
                return;
              }

              activeRafId = requestAnimationFrame(checkFrame);
            }

            activeRafId = requestAnimationFrame(checkFrame);

          }).catch(function (err) {
            if (token !== transitionToken) return;
            console.error('Playback failed', err);
            showError('Video could not play', function () {
              runTransition(targetVideo, holdOffset, isForward, branchKey, onComplete);
            });
          });
        }

        if (targetVideo.readyState >= 2 && Math.abs(targetVideo.currentTime) < 0.001) {
          startPlayback();
        } else {
          var onSeeked = function () {
            targetVideo.removeEventListener('seeked', onSeeked);
            startPlayback();
          };
          targetVideo.addEventListener('seeked', onSeeked, { once: true });
        }
      }

      // 10. Forward Action (Branch Click)
      function handleForwardClick(branchKey, btnElement) {
        if (isLocked || currentBranch !== null) return;

        var hadFocus = (document.activeElement === btnElement);
        var mediaObj = MEDIA_MAP[branchKey];
        if (!mediaObj) return;

        currentBranch = branchKey;
        announce('Loading ' + branchKey + ' transition');

        // Center calculation for label translation
        var btnRect = btnElement.getBoundingClientRect();
        var ctrlRect = controller.getBoundingClientRect();
        var targetCenter = ctrlRect.left + ctrlRect.width / 2;
        var btnCenter = btnRect.left + btnRect.width / 2;
        var dx = targetCenter - btnCenter;

        btnElement.style.transform = 'translate(' + dx.toFixed(1) + 'px, 0)';
        btnElement.classList.add('chosen-cell');

        // Collapse bar animation
        controller.classList.add('collapsed');

        runTransition(mediaObj.fwd, mediaObj.fwdHold, true, branchKey, function (token) {
          if (token !== transitionToken) return;

          // Transition to SELECTED state
          isLocked = false;
          btnElement.textContent = 'Reset';
          btnElement.classList.add('reset-state');
          btnElement.disabled = false;
          btnElement.tabIndex = 0;
          btnElement.setAttribute('aria-label', 'Reset to base scene');

          if (hadFocus) {
            btnElement.focus({ preventScroll: true });
          }

          announce(branchKey + ' state active. Click Reset to return to base.');
        });
      }

      // 11. Reverse Action (Reset Click)
      function handleReverseClick(branchKey, btnElement) {
        if (isLocked || currentBranch === null) return;

        var hadFocus = (document.activeElement === btnElement);
        var mediaObj = MEDIA_MAP[branchKey];
        if (!mediaObj) return;

        announce('Returning to base scene');

        // Parallel expand: Start bar opening and reverse video together
        controller.classList.remove('collapsed');
        btnElement.classList.remove('reset-state');
        btnElement.style.transform = '';
        btnElement.textContent = branchKey.charAt(0).toUpperCase() + branchKey.slice(1);
        btnElement.setAttribute('aria-label', 'Select ' + btnElement.textContent);
        setCapsulePos(0);

        runTransition(mediaObj.rev, mediaObj.revHold, false, branchKey, function (token) {
          if (token !== transitionToken) return;

          // Restore Base State
          btnElement.classList.remove('chosen-cell');
          currentBranch = null;
          isLocked = false;
          stage.classList.remove('title-hidden');

          enableAvailableButtons();

          if (hadFocus) {
            btnElement.focus({ preventScroll: true });
          }

          announce('Base scene ready');
        });
      }

      // 12. Attach Button Click Handlers
      controlButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var branchKey = btn.getAttribute('data-control');
          if (currentBranch === null) {
            handleForwardClick(branchKey, btn);
          } else if (currentBranch === branchKey) {
            handleReverseClick(branchKey, btn);
          }
        });
      });

      // 13. Page Visibility Lifecycle Guard
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (activeVideo && !activeVideo.paused) {
            activeVideo.pause();
          }
        } else {
          if (isLocked && activeVideo && activeVideo.paused) {
            activeVideo.play().catch(function () {});
          }
        }
      });

    })();
  </script>
</body>
</html>
